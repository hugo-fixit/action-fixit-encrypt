name: 'FixIt Encrypt Setup'
description: 'GitHub Actions for fixit-encrypt — Setup fixit-encrypt to encrypt your FixIt Hugo site content.'
inputs:
  version:
    description: 'fixit-encrypt version (e.g., "0.2.0") or "latest"'
    required: false
    default: 'latest'
runs:
  using: 'node24'
  main: 'dist/index.cjs'
branding:
  icon: 'lock'
  color: 'blue'
